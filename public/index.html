<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title><%= title %></title>
  <meta name="description" content="<%= description %>" />
  <meta name="keywords" content="<%= keywords %>" />
  <meta name="author" content="<%= siteName %>" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <meta name="googlebot" content="index, follow" />
  <meta name="theme-color" content="<%= themeColor %>" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="geo.region" content="IN-HR" />
  <meta name="geo.placename" content="Gurugram" />
  <link rel="canonical" href="<%= siteUrl %>/" />

  <link rel="icon" href="/images/logo-icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/images/logo-icon.png" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="<%= siteName %>" />
  <meta property="og:title" content="<%= title %>" />
  <meta property="og:description" content="<%= description %>" />
  <meta property="og:url" content="<%= siteUrl %>/" />
  <meta property="og:image" content="<%= ogImage %>" />
  <meta property="og:image:width" content="1166" />
  <meta property="og:image:height" content="905" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:alt" content="<%= ogImageAlt %>" />
  <meta property="og:locale" content="<%= locale %>" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="<%= title %>" />
  <meta name="twitter:description" content="<%= description %>" />
  <meta name="twitter:image" content="<%= ogImage %>" />
  <meta name="twitter:image:alt" content="<%= ogImageAlt %>" />

  <script type="application/ld+json"><%= structuredData %></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" href="/images/hero-corporate-meeting.webp" as="image" type="image/webp" fetchpriority="high" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet"
  />
</head>
<body>

  <noscript>
    <main>

    </main>
  </noscript>
</body>
</html>
